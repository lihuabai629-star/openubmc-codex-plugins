name: Validate marketplace
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: marketplace-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
      - name: Install locked Codex host
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix scripts/host
          echo "$PWD/scripts/host/node_modules/.bin" >> "$GITHUB_PATH"
      - run: python3 -I scripts/check_marketplace.py
      - name: Run plugin release gate contract tests
        run: python3 -B -m unittest discover -s scripts/tests -p "test_*.py"
      - name: Check bundled community skill integrations
        run: python3 -B scripts/check_community.py
      - name: Check bundled Run records and offline exports
        run: python3 -B scripts/check_records.py
      - name: Check packaged MDB property contracts and recovery
        run: python3 -B -m unittest discover -s scripts/property -p "test_*.py"
      - name: Check final plugin behavior and cold MCP startup
        id: behavior
        run: python3 -I scripts/check_behavior.py --output "$RUNNER_TEMP/public-behavior.json"
      - name: Qualify installed Host records with native Codex
        id: records
        run: >-
          python3 -B scripts/qualify_host_records.py
          --codex scripts/host/node_modules/.bin/codex
          --output "$RUNNER_TEMP/installed-host-records.json"
      - name: Summarize qualification
        if: ${{ !cancelled() }}
        env:
          BEHAVIOR_OUTCOME: ${{ steps.behavior.outcome }}
          RECORDS_OUTCOME: ${{ steps.records.outcome }}
        run: |
          printf 'Plugin behavior: %s\n\nInstalled Host records: %s\n\n' \
            "$BEHAVIOR_OUTCOME" "$RECORDS_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          for report in "$RUNNER_TEMP/public-behavior.json" "$RUNNER_TEMP/installed-host-records.json"; do
            if test -f "$report"; then
              sha256sum "$report" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

  windows:
    name: Windows native plugin bootstrap
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
      - name: Install locked Codex host
        shell: pwsh
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix scripts/host
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Check Windows setup boundary and native offline analysis
        shell: pwsh
        run: python -B scripts/check_portable_capabilities.py --output "$env:RUNNER_TEMP/portable-capabilities.json"
      - name: Install plugin and initialize setup mode
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "openubmc-marketplace.tar.gz"
          tar -czf $archive -C plugins openubmc
          if ($LASTEXITCODE -ne 0) { throw "Plugin archive staging failed" }
          $codex = Resolve-Path "scripts/host/node_modules/.bin/codex.cmd"
          ./scripts/qualify_windows_plugin.ps1 `
            -Archive $archive `
            -Codex $codex `
            -WorkRoot (Join-Path $env:RUNNER_TEMP "openubmc-windows-marketplace") `
            -MarketplaceRoot (Resolve-Path ".")
